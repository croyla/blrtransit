<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BLRTransit home">
    <meta name="keywords" content="Bus,blr,bangalore,transit">
    <title>BLRTransit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { fontFamily: { manrope: ['Manrope', 'sans-serif'] } } } }</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg" href="./assets/images/logo.svg">
</head>
<body class="font-manrope [word-spacing:0.08em] bg-[#f0f0f0] p-5 text-center">
<h1 class="flex justify-center">
    <img src="assets/images/logo.svg" alt="BLRTransit" width="100" height="100">
</h1>
<ul id="link-list" class="list-none p-0 flex flex-col items-center">Doing things for better transit.</ul>

<!-- Card modal -->
<div id="modal-overlay" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div id="modal-card" class="bg-white rounded-2xl shadow-2xl p-6 max-w-lg w-full text-left">
    <div class="flex justify-between items-start mb-4">
      <h2 id="modal-title" class="text-xl font-bold text-gray-800 pr-4 leading-snug"></h2> <h3 id="modal-time" class="text-m text-gray-400 mr-auto"></h3>
      <button id="modal-close" class="text-gray-400 hover:text-gray-700 text-2xl leading-none flex-shrink-0">&times;</button>
    </div>
    <div id="modal-links" class="flex flex-wrap gap-2 mb-4"></div>
    <p id="modal-about" class="text-gray-600 text-sm leading-relaxed"></p>
  </div>
</div>

<script>
  const ICONS = {
    link:      'assets/images/icon-link.svg',
    routelink: 'assets/images/icon-routelink.svg',
    vizlink:   'assets/images/icon-vizlink.svg',
    rlink:     'assets/images/icon-rlink.svg',
  };

  const LABELS = {
    link:      'View project page',
    routelink: 'View in action',
    vizlink:   'View in a visualiser',
    rlink:     'View source code',
  };

  const LINK_ORDER = ['link', 'routelink', 'vizlink', 'rlink'];

  const overlay = document.getElementById('modal-overlay');
  const modalTitle = document.getElementById('modal-title');
  const modalTime = document.getElementById('modal-time');
  const modalAbout = document.getElementById('modal-about');
  const modalLinks = document.getElementById('modal-links');

  function preloadFavicon(entry) {
    return new Promise(resolve => {
      if (!entry.link) { resolve(ICONS['link']); return; }
      const img = new Image();
      img.onload = () => resolve(img.src);
      img.onerror = () => resolve(ICONS['link']);
      img.src = `${new URL(entry.link).origin}/favicon.ico`;
    });
  }

  function openModal(name, entry) {
    modalTitle.textContent = name;
    modalTime.textContent = entry.time || '';
    modalAbout.textContent = entry.about || '';
    modalLinks.innerHTML = '';

    LINK_ORDER.forEach(key => {
      if (!entry[key]) return;
      const a = document.createElement('a');
      a.href = entry[key];
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.title = LABELS[key];
      a.className = 'inline-flex items-center gap-1.5 px-8 py-2.5 rounded-lg text-sm font-medium no-underline transition-colors duration-200 bg-[#ecf0f1] text-[#2c3e50] hover:bg-[#bdc3c7]';
      const img = document.createElement('img');
      img.src = key === 'link' ? entry._favicon : ICONS[key];
      img.alt = '';
      img.width = 18;
      img.height = 18;
      a.appendChild(img);
      modalLinks.appendChild(a);
    });

    overlay.classList.remove('hidden');
  }

  document.getElementById('modal-close').addEventListener('click', () => overlay.classList.add('hidden'));
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.add('hidden'); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') overlay.classList.add('hidden'); });

  fetch('assets/sources.json')
    .then(r => r.json())
    .then(data => {
      return Promise.all(
        Object.values(data).map(entry =>
          preloadFavicon(entry).then(src => { entry._favicon = src; })
        )
      ).then(() => data);
    })
    .then(data => {
      const linkList = document.getElementById('link-list');
      Object.keys(data).forEach(key => {
        const li = document.createElement('li');
        li.className = 'my-2';
        const btn = document.createElement('button');
        btn.className = 'w-[400px] text-[#2c3e50] bg-[#ecf0f1] px-6 py-4 rounded-lg transition-colors duration-200 text-lg font-medium hover:bg-[#bdc3c7] cursor-pointer';
        const text = document.createElement('p');
        text.className = 'text-left';
        text.textContent = key;
        const time = document.createElement('p');
        time.className = ' font-light text-right';
        time.textContent = data[key].time;
        // btn.textContent = key;
        btn.appendChild(text);
        btn.appendChild(time);
        btn.addEventListener('click', () => openModal(key, data[key]));
        li.appendChild(btn);
        linkList.appendChild(li);
      });
    })
    .catch(err => console.error('Error loading JSON:', err));

</script>
<section class="mt-12 mb-8 mx-auto w-[400px] text-left">
  <form id="contact-form" class="flex flex-col gap-4">
    <div>
      <label class="block text-sm font-medium text-gray-600 mb-1">Name <span class="text-gray-400 font-normal">(optional)</span></label>
      <input id="cf-name" type="text" placeholder="Your name" class="w-full px-3 py-2 rounded-lg bg-neutral-100 text-gray-800 text-sm outline-none focus:ring-2 focus:ring-[#2c3e50]">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-600 mb-1">Message</label>
      <textarea id="cf-message" rows="4" placeholder="Your message content." class="w-full px-3 py-2 rounded-lg bg-neutral-100 text-gray-800 text-sm outline-none focus:ring-2 focus:ring-[#2c3e50] resize-none"></textarea>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-600 mb-1">Where can I reach you? <span class="text-gray-400 font-normal">(optional)</span></label>
      <input id="cf-reach" type="text" placeholder="e.g. email, phone number, github, etc…" class="w-full px-3 py-2 rounded-lg bg-neutral-100 text-gray-800 text-sm outline-none focus:ring-2 focus:ring-[#2c3e50]">
    </div>
    <p id="contact-error" class="hidden text-red-500 text-sm"></p>
    <button type="submit" class="bg-[#ecf0f1] text-[#2c3e50] font-medium py-2 rounded-lg hover:bg-[#bdc3c7] transition-colors duration-200">Send a message</button>
  </form>
  <p id="contact-success" class="hidden text-green-600 text-sm mt-2">Message sent — thanks!</p>
</section>

<script>
  const WORKER_URL = 'https://contactform.blrtransit.com';

  document.getElementById('contact-form').addEventListener('submit', async e => {
    e.preventDefault();
    const errorEl = document.getElementById('contact-error');
    const successEl = document.getElementById('contact-success');
    errorEl.classList.add('hidden');
    successEl.classList.add('hidden');

    const message = document.getElementById('cf-message').value.trim();
    if (!message) {
      errorEl.textContent = 'Message is required.';
      errorEl.classList.remove('hidden');
      return;
    }

    const payload = {
      name:      document.getElementById('cf-name').value.trim(),
      message,
      reachOn:   document.getElementById('cf-reach').value.trim(),
      browser:   navigator.userAgent,
      timezone:  Intl.DateTimeFormat().resolvedOptions().timeZone,
      timestamp: new Date().toISOString(),
    };

    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';

    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error(await res.text());
      e.target.reset();
      successEl.classList.remove('hidden');
    } catch (err) {
      errorEl.textContent = 'Failed to send — please try again.';
      errorEl.classList.remove('hidden');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send';
    }
  });
</script>

<footer></footer>
</body>
</html>
