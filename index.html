<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BLRTransit home">
    <meta name="keywords" content="Bus,blr,bangalore,transit">
    <title>BLRTransit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { fontFamily: { manrope: ['Manrope', 'sans-serif'] } } } }</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg" href="./assets/images/logo.svg">
</head>
<body class="font-manrope [word-spacing:0.08em] bg-[#f0f0f0] p-5 text-center">
<h1 class="flex justify-center">
    <img src="assets/images/logo.svg" alt="BLRTransit" width="100" height="100">
</h1>
<ul id="link-list" class="list-none p-0 flex flex-col items-center"></ul>

<!-- Modal -->
<div id="modal-overlay" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div id="modal-card" class="bg-white rounded-2xl shadow-2xl p-6 max-w-lg w-full text-left">
    <div class="flex justify-between items-start mb-4">
      <h2 id="modal-title" class="text-xl font-bold text-gray-800 pr-4 leading-snug"></h2>
      <button id="modal-close" class="text-gray-400 hover:text-gray-700 text-2xl leading-none flex-shrink-0">&times;</button>
    </div>
    <div id="modal-links" class="flex flex-wrap gap-2 mb-4"></div>
    <p id="modal-about" class="text-gray-600 text-sm leading-relaxed"></p>
  </div>
</div>

<script>
  const ICONS = {
    link:      'assets/images/icon-link.svg',
    routelink: 'assets/images/icon-routelink.svg',
    vizlink:   'assets/images/icon-vizlink.svg',
    rlink:     'assets/images/icon-rlink.svg',
  };

  const LABELS = {
    link:      'View project page',
    routelink: 'View in action',
    vizlink:   'View in a visualiser',
    rlink:     'View source code',
  };

  const LINK_ORDER = ['link', 'routelink', 'vizlink', 'rlink'];

  const overlay = document.getElementById('modal-overlay');
  const modalTitle = document.getElementById('modal-title');
  const modalAbout = document.getElementById('modal-about');
  const modalLinks = document.getElementById('modal-links');

  function openModal(name, entry) {
    modalTitle.textContent = name;
    modalAbout.textContent = entry.about || '';
    modalLinks.innerHTML = '';

    LINK_ORDER.forEach(key => {
      if (!entry[key]) return;
      const a = document.createElement('a');
      a.href = entry[key];
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.title = LABELS[key];
      a.className = 'inline-flex items-center gap-1.5 px-8 py-2.5 rounded-lg text-sm font-medium no-underline transition-colors duration-200 bg-[#ecf0f1] text-[#2c3e50] hover:bg-[#bdc3c7]';
      const img = document.createElement('img');
      img.src = ICONS[key];
      img.alt = '';
      img.width = 18;
      img.height = 18;
      a.appendChild(img);
      // a.appendChild(document.createTextNode(LABELS[key]));
      modalLinks.appendChild(a);
    });

    overlay.classList.remove('hidden');
  }

  document.getElementById('modal-close').addEventListener('click', () => overlay.classList.add('hidden'));
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.add('hidden'); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') overlay.classList.add('hidden'); });

  fetch('assets/sources.json')
    .then(r => r.json())
    .then(data => {
      const linkList = document.getElementById('link-list');
      Object.keys(data).forEach(key => {
        const li = document.createElement('li');
        li.className = 'my-2';
        const btn = document.createElement('button');
        btn.className = 'w-[300px] text-center text-[#2c3e50] bg-[#ecf0f1] px-6 py-4 rounded-lg transition-colors duration-200 text-lg font-medium hover:bg-[#bdc3c7] cursor-pointer';
        btn.textContent = key;
        btn.addEventListener('click', () => openModal(key, data[key]));
        li.appendChild(btn);
        linkList.appendChild(li);
      });
    })
    .catch(err => console.error('Error loading JSON:', err));
</script>
<footer>
</footer>
</body>
</html>
